site_name: Digital Twin IoT
site_description: "Documentation for IoTwin the Digital Twin IoT Simulation Platform"
site_author: "Christian Fleischmann"
repo_url: https://github.com/Bearlyuseful/IoTwin
repo_name: Bearlyuseful/IoTwin

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tabs
    - toc.integrate
    - search.suggest
    - content.tabs.link
    - content.code.copy
  palette:
    scheme: slate
    primary: blue
    accent: teal

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - def_list
  - footnotes
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed
  - pymdownx.tasklist

nav:
  - Home: index.md
  - Quickstart: user/quickstart.md
  - Roadmap: roadmap.md
  - Developer Guide:
      - Build Instructions: dev/build_instructions.md
      - Architecture Overview: dev/architecture_overview.md
      - Bus Protocol: dev/protocol.md
      - Real-Time Operation: dev/realtime.md
      - Visualizer: dev/visualizer.md
      - Firmware (NUCLEO-G0B1RE): dev/firmware.md
      - CAN Tools (DBC, ISO-TP, SocketCAN): dev/can_tools.md
      - Component Database: dev/component_database.md
      - Packaging: dev/packaging.md
  - API Reference: api/index.html
  - Architecture Decisions:
      - ADR 0001 Documentation: adr/0001-choice-of-documentation.md
      - ADR 0002 Bus and Protocol: adr/0002-bus-server-and-text-protocol.md
      - ADR 0003 Platforms: adr/0003-linux-rt-target-windows-best-effort.md
      - ADR 0004 Firmware: adr/0004-firmware-in-mono-repo-bare-metal.md
      - ADR 0005 Repository Layout: adr/0005-repository-layout.md
