name: Build and Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core-linux:
    name: Core (Linux, GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        run: cmake --preset gcc-release -DIOTWIN_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset gcc-release

      - name: Run tests
        run: ctest --preset gcc-release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: iotwin-core-linux-x64
          path: |
            build/gcc-release/bin/iotwin-bus
            build/gcc-release/bin/can_sim
            build/gcc-release/bin/serial_bridge

  core-windows:
    name: Core (Windows, MSYS2 GCC)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSYS2 (UCRT64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            git
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Configure
        run: cmake --preset gcc-release -DIOTWIN_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset gcc-release

      - name: Run tests
        run: ctest --preset gcc-release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: iotwin-core-windows-x64
          path: |
            build/gcc-release/bin/iotwin-bus.exe
            build/gcc-release/bin/can_sim.exe
            build/gcc-release/bin/serial_bridge.exe

  firmware:
    name: Firmware (NUCLEO-G0B1RE)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM toolchain
        run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi libnewlib-arm-none-eabi ninja-build

      - name: Configure
        run: cmake --preset nucleo-g0b1re -DIOTWIN_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build --preset nucleo-g0b1re

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: iotwin-gateway-nucleo-g0b1re
          path: |
            firmware/build/nucleo-g0b1re/iotwin_gateway.elf
            firmware/build/nucleo-g0b1re/iotwin_gateway.bin
            firmware/build/nucleo-g0b1re/iotwin_gateway.hex

  docs:
    name: Documentation
    needs: [core-linux, core-windows, firmware]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz
          pip install mkdocs-material mkdocs-mermaid2-plugin mkdocs-git-revision-date-localized-plugin

      - name: Generate Doxygen API docs
        run: doxygen doxygen/Doxyfile

      - name: Build MkDocs site
        run: mkdocs build

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
